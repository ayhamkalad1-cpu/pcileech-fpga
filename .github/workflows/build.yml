name: Build CaptainDMA 75T Firmware
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Compile with Vivado
        uses: fischhammer/vivado-action@v1.1
        with:
          vivado-version: '2023.2'
          run: |
            cd CaptainDMA/75t484_x1
            vivado -mode batch -source vivado_build.tcl
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stark-75T-Firmware
          path: CaptainDMA/75t484_x1/**/*.bin
